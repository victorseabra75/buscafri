[project]
name = "buscafri"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "duckdb",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "playwright",
    "slowapi",
    "xlsxwriter",
    "streamlit",
    "httpx2>=2.13.1",
    "pytest-asyncio>=1.4.0",
    "pydantic-settings>=2.15.0",
    "groq>=1.7.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "poethepoet",
    "httpx2>=2.13.1",
]

[tool.poe.tasks]
fix = "ruff check . --fix"
format = "ruff format ."
lint = "ruff check ."
test = "pytest -v"

[tool.poe.tasks.dev]
sequence = ["fix", "format", "lint", "test"]

[tool.uv]
managed = true
package = false
